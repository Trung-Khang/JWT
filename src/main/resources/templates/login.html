<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập JWT</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="card"><h1>Đăng nhập</h1><p>JWT Spring Boot 3</p><form id="login-form"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Mật khẩu<input id="password" type="password" required autocomplete="current-password"></label><button id="login-button" type="submit">Đăng nhập</button><p id="message" role="alert"></p></form><p class="hint">Tạo tài khoản qua <code>POST /auth/signup</code> trước khi đăng nhập.</p></main><script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script><script src="/js/mainjs.js"></script></body></html>
