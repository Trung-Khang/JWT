spring.application.name=jwt-springboot3
server.port=${SERVER_PORT:8005}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jwt_springboot3?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
security.jwt.secret-key=${JWT_SECRET_BASE64:}
security.jwt.expiration-time=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:8005}
